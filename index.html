<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR 3D Model Viewer</title>
  
  <!-- Import Google Model Viewer (version pinned so it can't change under you) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <!-- WebAR 3D Model -->
  <model-viewer src="model.glb" 
                ios-src="model.usdz"
                alt="3D model"
                ar
                ar-modes="scene-viewer quick-look webxr"
                ar-placement="floor"
                ar-scale="auto"
                camera-controls
                auto-rotate
                poster="poster.png"
                shadow-intensity="1"
                style="width: 100%; height: 100vh;">
  </model-viewer>

  <script>
    // Optional: tells you why AR failed instead of silently returning to the 3D view
    const mv = document.querySelector("model-viewer");
    mv.addEventListener("ar-status", (e) => {
      if (e.detail.status === "failed") {
        alert("AR failed to start. Check HTTPS, that model.glb is reachable, and that ARCore is installed.");
      }
    });
    mv.addEventListener("error", (e) => console.error("Model error:", e.detail));
  </script>

</body>
</html>
