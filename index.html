<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Model Viewer AR Example</title>
  
  <!-- Import the model-viewer component -->
  <script type="module" src="https://unpkg.com"></script>
  
  <style>
    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- AR Configured Model Viewer -->
  <model-viewer 
    src="model.glb" 
    ios-src="model.usdz"
    alt="An interactive 3D model with AR capability" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
    
    <!-- AR Activation Button (appears in the bottom right corner) -->
    <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
      👋 View in your space
    </button>

  </model-viewer>

</body>
</html>
